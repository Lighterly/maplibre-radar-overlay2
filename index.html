	<script>
		(() => {
			"use strict";

			const params =
				new URLSearchParams(
					window.location.search
				);

			function getBooleanParam(
				name,
				defaultValue
			) {
				const value =
					params.get(name);

				if (value === null) {
					return defaultValue;
				}

				const normalized =
					value.trim().toLowerCase();

				if (
					normalized === "1" ||
					normalized === "true"
				) {
					return true;
				}

				if (
					normalized === "0" ||
					normalized === "false"
				) {
					return false;
				}

				return defaultValue;
			}

			function clamp(
				value,
				min,
				max
			) {
				if (
					!Number.isFinite(value)
				) {
					return min;
				}

				return Math.min(
					max,
					Math.max(min, value)
				);
			}

			function toNumber(value) {
				const number =
					Number(value);

				return Number.isFinite(number) ?
					number :
					null;
			}

			const pullKey =
				params.get("pullKey") ||
				params.get("key") ||
				"";

			function sanitizeColor(value) {
				let color =
					String(value || "").trim();

				if (
					/^[0-9a-fA-F]{3}$/.test(color) ||
					/^[0-9a-fA-F]{6}$/.test(color) ||
					/^[0-9a-fA-F]{8}$/.test(color)
				) {
					color =
						`#${color}`;
				}

				if (
					/^#[0-9a-fA-F]{3,8}$/.test(color)
				) {
					return color;
				}

				return "#00eaff";
			}

			function sanitizeRadarBg(value) {
				const color =
					String(value || "").trim();

				if (
					color.toLowerCase() ===
					"transparent"
				) {
					return "transparent";
				}

				return sanitizeColor(color);
			}

			function hexToRgba(
				hex,
				alpha
			) {
				let value =
					hex.replace("#", "");

				if (value.length === 3) {
					value =
						value
							.split("")
							.map(
								char =>
									char + char
							)
							.join("");
				}

				if (value.length < 6) {
					return `rgba(0,234,255,${alpha})`;
				}

				const r =
					parseInt(
						value.slice(0, 2),
						16
					);

				const g =
					parseInt(
						value.slice(2, 4),
						16
					);

				const b =
					parseInt(
						value.slice(4, 6),
						16
					);

				return `rgba(${r},${g},${b},${alpha})`;
			}

			const mainColor =
				sanitizeColor(
					params.get("mainColor") ||
					"#00eaff"
				);

			const bgColor =
				sanitizeColor(
					params.get("bgColor") ||
					"#11131a"
				);

			const radarBg =
				sanitizeRadarBg(
					params.get("radarBg") ||
					"#080b0d"
				);

			const infoOpacity =
				clamp(
					parseFloat(
						params.get("opacity") ?? "0.96"
					),
					0,
					1
				);

			const clockSize =
				clamp(
					parseFloat(
						params.get("clockSize") ?? "14"
					),
					1,
					100
				);

			const routeAnimation =
				getBooleanParam(
					"routeAnimation",
					true
				);

			const routeAnimationDuration =
				clamp(
					parseFloat(
						params.get("routeAnimationDuration") ?? "1000"
					),
					0,
					10000
				);

			const followOSRM =
				getBooleanParam(
					"followOSRM",
					false
				);

			const smoothBearingEnabled =
				getBooleanParam(
					"smoothBearing",
					true
				);

			const smoothBearingDuration =
				clamp(
					parseFloat(
						params.get("smoothBearingDuration") ??
						params.get("smoothBearingDurationMs") ??
						"1000"
					),
					50,
					10000
				);

			const speedAnimation =
				getBooleanParam(
					"speedAnimation",
					false
				);

			const avatarURL =
				params.get("avatarURL") || "";

			const avatarOpacity =
				clamp(
					parseFloat(
						params.get("avatarOpacity") ?? "1"
					),
					0,
					1
				);

			const zoom =
				clamp(
					parseFloat(
						params.get("zoom") ?? "16"
					),
					2,
					22
				);

			const pitch =
				clamp(
					parseFloat(
						params.get("pitch") ?? "0"
					),
					0,
					85
				);

			const followBearing =
				getBooleanParam(
					"followBearing",
					true
				);

			let showRadar =
				getBooleanParam(
					"showRadar",
					true
				);

			const speedAnimationDuration =
				clamp(
					parseFloat(
						params.get("speedAnimationDuration") ?? "500"
					),
					50,
					10000
				);

			const speedLabel =
				params.get("speedLabel") ||
				"Speed";

			const temperatureLabel =
				params.get("temperatureLabel") ||
				"Temperature";

			const kickChannelParam =
				params.get("kickChannel") || "";

			const CHANNEL =
				kickChannelParam.replace(
					/_/g,
					"-"
				);

			const radar =
				document.getElementById(
					"radar"
				);

			const infoCard =

					"info-card"
				);

			const avatar =
				document.getElementById(
					"avatar"
				);

			const positionMarker =
				document.getElementById(
					"position-marker"
				);

			const speedEl =
				document.getElementById(
					"speed"
				);

			const speedContainer =
				document.getElementById(
					"speed-container"
				);

			const speedLabelEl =
				document.getElementById(
					"speed-label"
				);

			const temperatureEl =
				document.getElementById(
					"temperature"
				);

			const temperatureContainer =
				document.getElementById(
					"temperature-container"
				);

			const temperatureLabelEl =
				document.getElementById(
					"temperature-label"
				);

			const clockEl =
				document.getElementById(
					"clock"
				);

			const clockLabelEl =
				document.getElementById(
					"clock-label"
				);

			const statusEl =
				document.getElementById(
					"status"
				);

			const locationIcon =
				document.getElementById(
					"location-icon"
				);

			const neighborhoodEl =
				document.getElementById(
					"neighborhood"
				);

			const regionEl =
				document.getElementById(
					"region"
				);

			const neighborhoodSkeleton =
				document.getElementById(
					"neighborhood-skeleton"
				);

			const regionSkeleton =
				document.getElementById(
					"region-skeleton"
				);

			function updateRadarVisibility() {
				radar.style.display =
					showRadar ? "" : "none";

				if (showRadar) {
					speedContainer.classList.remove(
						"hidden"
					);

					speedContainer.classList.add(
						"flex"
					);

					temperatureContainer.classList.add(
						"hidden"
					);

					temperatureContainer.classList.remove(
						"flex"
					);
				} else {
					speedContainer.classList.add(
						"hidden"
					);

					speedContainer.classList.remove(
						"flex"
					);

					temperatureContainer.classList.remove(
						"hidden"
					);

					temperatureContainer.classList.add(
						"flex"
					);
				}
			}

			speedLabelEl.textContent =
				speedLabel;

			temperatureLabelEl.textContent =
				temperatureLabel;

			updateRadarVisibility();

			radar.style.backgroundColor =
				radarBg;

			clockEl.style.fontSize =
				`${clockSize}px`;

			radar.style.borderColor =
				mainColor;

			radar.style.boxShadow = `
				0 0 7px ${mainColor},
				0 0 18px ${hexToRgba(mainColor, 0.7)},
				inset 0 0 10px rgba(0,0,0,.65)
			`;

			infoCard.style.backgroundColor =
				hexToRgba(
					bgColor,
					infoOpacity
				);

			speedEl.style.color =
				mainColor;

			temperatureEl.style.color =
				mainColor;

			locationIcon.style.color =
				mainColor;

			locationIcon.style.filter =
				`drop-shadow(0 0 7px ${hexToRgba(mainColor, 0.8)})`;

			positionMarker.style.borderColor =
				mainColor;

			statusEl.style.backgroundColor =
				mainColor;

			statusEl.style.boxShadow =
				`0 0 7px ${mainColor}`;

			avatar.style.opacity =
				String(avatarOpacity);

			const fallbackAvatar =
				makeFallbackAvatar(
					mainColor
				);

			avatar.src =
				avatarURL ||
				fallbackAvatar;

			avatar.addEventListener(
				"error",
				() => {
					if (
						avatar.src !==
						fallbackAvatar
					) {
						avatar.src =
							fallbackAvatar;
					}
				},
				{
					once: true
				}
			);

			const routeCoordinates = [];

			let routeAnimationFrame =
				null;

			let bearingAnimationFrame =
				null;

			let bearingAnimationId =
				0;

			let map = null;
			let data = null;
			let markerReady = false;
			let firstFixReceived = false;
			let lastCoordinate = null;
			let lastGeocodedCoordinate = null;
			let geocodingInProgress = false;
			let locationSubscription = null;
			let speedSubscription = null;
			let headingSubscription = null;

			let streamerTimeZone = null;
			let streamerTimeZoneSource = null;
			let lastStreamerTimestamp = null;
			let lastHeading = null;
			let currentBearing = 0;

			let displayedSpeed = null;
			let speedAnimationTimer = null;

			let temperatureRequestController =
				null;

			const SPEED_DIGIT_HEIGHT = 17;

			const defaultCenter =
				[0, 0];

			const GEOCODE_DISTANCE_METERS =
				100;

			const TEMPERATURE_DISTANCE_METERS =
				5000;

			const MIN_BEARING_DISTANCE_METERS =
				5;

			const GOOGLE_SATELLITE_TILES = [
				"https://mt0.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
				"https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
				"https://mt2.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
				"https://mt3.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"
			];

			function metersBetween(
				a,
				b
			) {
				const earthRadius =
					6371008.8;

				const p1 =
					a.latitude *
					Math.PI / 180;

				const p2 =
					b.latitude *
					Math.PI / 180;

				const dp =
					(b.latitude - a.latitude) *
					Math.PI / 180;

				const dl =
					(b.longitude - a.longitude) *
					Math.PI / 180;

				const h =
					Math.sin(dp / 2) ** 2 +
					Math.cos(p1) *
					Math.cos(p2) *
					Math.sin(dl / 2) ** 2;

				return (
					2 *
					earthRadius *
					Math.asin(
						Math.sqrt(h)
					)
				);
			}

			function calculateBearing(
				a,
				b
			) {
				const lat1 =
					a.latitude *
					Math.PI / 180;

				const lat2 =
					b.latitude *
					Math.PI / 180;

				const deltaLongitude =
					(b.longitude - a.longitude) *
					Math.PI / 180;

				const y =
					Math.sin(deltaLongitude) *
					Math.cos(lat2);

				const x =
					Math.cos(lat1) *
					Math.sin(lat2) -
					Math.sin(lat1) *
					Math.cos(lat2) *
					Math.cos(deltaLongitude);

				return (
					Math.atan2(y, x) *
					180 / Math.PI +
					360
				) % 360;
			}

			function normalizeBearing(
				value
			) {
				return (
					(value % 360) +
					360
				) % 360;
			}

			function shortestBearingDifference(
				from,
				to
			) {
				return (
					(to - from + 540) %
					360
				) - 180;
			}

			function setMapBearing(
				bearing
			) {
				if (
					!map ||
					!followBearing ||
					pitch <= 0 ||
					!Number.isFinite(bearing)
				) {
					return;
				}

				currentBearing =
					normalizeBearing(
						bearing
					);

				map.jumpTo({
					bearing:
						currentBearing
				});
			}

			function animateBearingTo(
				target
			) {
				if (
					!map ||
					!followBearing ||
					pitch <= 0 ||
					!Number.isFinite(target)
				) {
					return;
				}

				target =
					normalizeBearing(
						target
					);

				const start =
					currentBearing;

				const difference =
					shortestBearingDifference(
						start,
						target
					);

				bearingAnimationId++;

				const animationId =
					bearingAnimationId;

				if (bearingAnimationFrame) {
					cancelAnimationFrame(
						bearingAnimationFrame
					);

					bearingAnimationFrame =
						null;
				}

				const startTime =
					performance.now();

				const animate =
					now => {
						if (
							animationId !==
							bearingAnimationId
						) {
							return;
						}

						const progress =
							clamp(
								(now - startTime) /
								smoothBearingDuration,
								0,
								1
							);

						const eased =
							1 -
							Math.pow(
								1 - progress,
								3
							);

						currentBearing =
							normalizeBearing(
								start +
								difference *
								eased
							);

						map.jumpTo({
							bearing:
								currentBearing
						});

						if (
							progress < 1
						) {
							bearingAnimationFrame =
								requestAnimationFrame(
									animate
								);
						} else {
							bearingAnimationFrame =
								null;

							currentBearing =
								target;

							map.jumpTo({
								bearing:
									currentBearing
							});
						}
					};

				bearingAnimationFrame =
					requestAnimationFrame(
						animate
					);
			}

			function interpolateBearing(
				from,
				to,
				progress
			) {
				const difference =
					shortestBearingDifference(
						from,
						to
					);

				return normalizeBearing(
					from +
					difference *
					progress
				);
			}

			function normalizeLocation(
				location
			) {
				if (!location) {
					return null;
				}

				const latitude =
					toNumber(
						location.latitude ??
						location.lat ??
						location.coords?.latitude ??
						location.location?.latitude
					);

				const longitude =
					toNumber(
						location.longitude ??
						location.lng ??
						location.lon ??
						location.coords?.longitude ??
						location.location?.longitude
					);

				if (
					latitude === null ||
					longitude === null
				) {
					return null;
				}

				if (
					latitude < -90 ||
					latitude > 90 ||
					longitude < -180 ||
					longitude > 180
				) {
					return null;
				}

				return {
					latitude,
					longitude
				};
			}

			function extractTimestamp(
				value
			) {
				if (!value) {
					return null;
				}

				const candidates = [
					value.timestamp,
					value.timeStamp,
					value.time,
					value.datetime,
					value.date,
					value.createdAt,
					value.updatedAt,
					value.coords?.timestamp
				];

				for (
					const candidate of candidates
				) {
					if (
						candidate === undefined ||
						candidate === null
					) {
						continue;
					}

					const parsed =
						candidate instanceof Date ?
							candidate.getTime() :
							Date.parse(candidate);

					if (
						Number.isFinite(parsed)
					) {
						return parsed;
					}

					const numeric =
						Number(candidate);

					if (
						Number.isFinite(
							numeric
						)
					) {
						return numeric < 10000000000 ?
							numeric * 1000 :
							numeric;
					}
				}

				return null;
			}

			function extractTimeZone(
				value
			) {
				if (!value) {
					return null;
				}

				const candidates = [
					value?.timeZone,
					value?.timezone,
					value?.tz,
					value.location?.timeZone,
					value.location?.timezone,
					value.metadata?.timeZone,
					value.metadata?.timezone,
					value.streamer?.timeZone,
					value.streamer?.timezone
				];

				for (
					const candidate of candidates
				) {
					if (
						typeof candidate ===
						"string" &&
						isValidTimeZone(
							candidate
						)
					) {
						return candidate;
					}
				}

				return null;
			}

			function isValidTimeZone(
				timeZone
			) {
				if (
					typeof timeZone !==
					"string" ||
					!timeZone
				) {
					return false;
				}

				try {
					new Intl.DateTimeFormat(
						"en-US",
						{
							timeZone
						}
					);

					return true;
				} catch {
					return false;
				}
			}

			function setTimeZone(

				source = "location"

				}

				streamerTimeZone =
					timeZone;

				streamerTimeZoneSource =
					source;

				updateClock();

				return true;
			}

			async function updateTemperature(
				location
			) {
				if (!location) {
					return;

				if (
					lastTemperatureCoordinate &&
					metersBetween(
						lastTemperatureCoordinate,
						location
					) <
					TEMPERATURE_DISTANCE_METERS
				) {
					return;
				}

				lastTemperatureCoordinate = {
					...location
				};

				try {
					temperatureRequestController
						?.abort?.();

					temperatureRequestController =
						new AbortController();

					const url =
						new URL(
							"https://api.open-meteo.com/v1/forecast"
						);

					url.searchParams.set(
						"latitude",
						location.latitude
					);

					url.searchParams.set(
						"longitude",
						location.longitude
					);

					url.searchParams.set(
						"current",
						"temperature_2m"
					);

					url.searchParams.set(
						"temperature_unit",
						"celsius"
					);

					url.searchParams.set(
						"timezone",
						"auto"
					);

					const response =
						await fetch(
							url.toString(),
							{
								method: "GET",
								cache: "no-store",
								signal:
									temperatureRequestController
										.signal
							}
						);

					if (!response.ok) {
						throw new Error(
							`Temperature request failed: ${response.status}`
						);
					}

					const weather =
						await response.json();

					const temperature =
						toNumber(
							weather?.current
								?.temperature_2m
						);

					if (
						temperature !== null
					) {
						temperatureEl.textContent =
							`${Math.round(
								temperature

					}
				} catch (error) {
					if (
						error?.name !==
						"AbortError"
					) {
						console.warn(
							"Temperature update error:",
							error
						);
					}
				}
			}

			async function reverseGeocode(
				latitude,
				longitude
			) {
				const url =
					new URL(
						"https://api.bigdatacloud.net/data/reverse-geocode-client"
					);

				url.searchParams.set(
					"latitude",
					latitude
				);

				url.searchParams.set(
					"longitude",
					longitude
				);

				url.searchParams.set(
					"localityLanguage",
					"en"
				);

				const response =
					await fetch(
						url.toString(),
						{
							method: "GET",
							cache: "no-store"
						}
					);

				if (!response.ok) {
					throw new Error(
						`Reverse geocoding failed: ${response.status}`
					);
				}

				return response.json();
			}

			function extractGeocoderTimeZone(
				data
			) {
				if (!data) {
					return null;
				}

				const directCandidates = [
					data.timeZone,
					data.timezone,
					data.ianaTimeZone,
					data.ianaTimezone
				];

				for (
					const candidate of directCandidates
				) {
					if (
						typeof candidate ===
						"string" &&
						isValidTimeZone(
							candidate
						)
					) {
						return candidate;
					}
				}

				const informative =
					data.localityInfo
						?.informative;

				if (
					Array.isArray(
						informative
					)
				) {
					for (
						const item of informative
					) {
						const candidates = [
							item.timeZone,
							item.timezone,
							item.ianaTimeZone,
							item.ianaTimezone,
							item.name,
							item.isoName
						];

						for (
							const candidate of candidates
						) {
							if (
								typeof candidate ===
								"string" &&
								isValidTimeZone(
									candidate
								)
							) {
								return candidate;
							}
						}
					}
				}

				return null;
			}

			async function updateLocationDetails(
				location
			) {
				if (
					geocodingInProgress
				) {
					return;
				}

				if (
					lastGeocodedCoordinate &&
					metersBetween(
						lastGeocodedCoordinate,
						location
					) <
					GEOCODE_DISTANCE_METERS
				) {
					return;
				}

				lastGeocodedCoordinate = {
					...location
				};

				geocodingInProgress =
					true;

				try {
					data =
						await reverseGeocode(
							location.latitude,
							location.longitude
						);

					showLocation(
						data
					);

					if (
						!streamerTimeZone
					) {
						const timeZone =
							extractGeocoderTimeZone(
								data
							);

						if (timeZone) {
							setTimeZone(
								timeZone,
								"geocoder"
							);
						}
					}
				} catch (error) {
					console.warn(
						"RealtimeIRL reverse geocoding error:",
						error
					);
				} finally {
					geocodingInProgress =
						false;
				}
			}

			function interpolateCoordinate(
				a,
				b,
				progress
			) {
				return [
					a[0] +
					(b[0] - a[0]) *
					progress,

					a[1] +
					(b[1] - a[1]) *
					progress
				];
			}

			function cleanRouteCoordinates(
				coordinates
			) {
				if (
					!Array.isArray(
						coordinates
					)
				) {
					return [];
				}

				const cleaned = [];

				for (
					const coordinate of coordinates
				) {
					if (
						!Array.isArray(
							coordinate
						) ||
						coordinate.length < 2
					) {
						continue;
					}

					const longitude =
						toNumber(
							coordinate[0]
						);

					const latitude =
						toNumber(
							coordinate[1]
						);

					if (
						longitude === null ||
						latitude === null
					) {
						continue;
					}

					const point = [
						longitude,
						latitude
					];

					const previous =
						cleaned.at(-1);

					if (
						!previous ||
						previous[0] !==
							point[0] ||
						previous[1] !==
							point[1]
					) {
						cleaned.push(
							point
						);
					}
				}

				return cleaned;
			}

			function prepareOSRMRoute(
				coordinates
			) {
				const points =
					cleanRouteCoordinates(
						coordinates
					);

				if (
					points.length < 2
				) {
					return {
						coordinates:
							points,
						cumulativeDistances:
							[0],
						totalDistance: 0
					};
				}

				const cumulative =
					[0];

				let total =
					0;

				for (
					let index = 1;
					index < points.length;
					index++
				) {
					const a =
						points[
							index - 1
						];

					const b =
						points[
							index
						];

					total +=
						metersBetween(
							{
								latitude:
									a[1],
								longitude:
									a[0]
							},
							{
								latitude:
									b[1],
								longitude:
									b[0]
							}
						);

					cumulative.push(
						total
					);
				}

				return {
					coordinates:
						points,
					cumulativeDistances:
						cumulative,
					totalDistance:
						total
				};
			}

			function pointAlongOSRMRoute(
				route,
				progress
			) {
				if (
					!route?.coordinates?.length
				) {
					return null;
				}

				if (
					route.coordinates.length ===
					1
				) {
					return [
						...route.coordinates[0]
					];
				}

				const clampedProgress =
					clamp(
						progress,
						0,
						1
					);

				const targetDistance =
					route.totalDistance *
					clampedProgress;

				for (
					let index = 1;
					index <
					route.coordinates.length;
					index++
				) {
					const previousDistance =
						route
							.cumulativeDistances[
								index - 1
							];

					const currentDistance =
						route
							.cumulativeDistances[
								index
							];

					if (
						targetDistance <=
						currentDistance
					) {
						const segmentDistance =
							currentDistance -
							previousDistance;

						const segmentProgress =
							segmentDistance > 0 ?
								(
									targetDistance -
									previousDistance
								) /
								segmentDistance :
								0;

						return interpolateCoordinate(
							route.coordinates[
								index - 1
							],
							route.coordinates[
								index
							],
							segmentProgress
						);
					}
				}

				return [
					...route.coordinates.at(
						-1
					)
				];
			}

			function routePrefixCoordinates(
				route,
				progress
			) {
				if (
					!route?.coordinates?.length
				) {
					return [];
				}

				if (
					route.coordinates.length ===
					1
				) {
					return [
						[
							...route.coordinates[0]
						]
					];
				}

				const clampedProgress =
					clamp(
						progress,
						0,
						1
					);

				const targetDistance =
					route.totalDistance *
					clampedProgress;

				const result =
					[
						[
							...route.coordinates[0]
						]
					];

				for (
					let index = 1;
					index <
					route.coordinates.length;
					index++
				) {
					const previousDistance =
						route
							.cumulativeDistances[
								index - 1
							];

					const currentDistance =
						route
							.cumulativeDistances[
								index
							];

					if (
						targetDistance <
						currentDistance
					) {
						const segmentDistance =
							currentDistance -
							previousDistance;

						const segmentProgress =
							segmentDistance > 0 ?
								(
									targetDistance -
									previousDistance
								) /
								segmentDistance :
								0;

						result.push(
							interpolateCoordinate(
								route.coordinates[
									index - 1
								],
								route.coordinates[
									index
								],
								segmentProgress
							)
						);

						return result;
					}

					result.push([
						...route.coordinates[
							index
						]
					]);
				}

				return result;
			}

			async function requestOSRMRoute(
				from,
				to
			) {
				const url =
					`https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson&steps=false`;

				const response =
					await fetch(
						url,
						{
							method: "GET",
							cache: "no-store"
						}
					);

				if (
					!response.ok
				) {
					throw new Error(
						`OSRM request failed: ${response.status}`
					);
				}

				const result =
					await response.json();

				const route =
					result?.routes?.[0];

				const coordinates =
					route?.geometry?.coordinates;

				if (
					!Array.isArray(
						coordinates
					) ||
					coordinates.length <
						2
				) {
					throw new Error(
						"OSRM returned no usable route geometry."
					);
				}

				return {
					...prepareOSRMRoute(
						coordinates
					),
					rawStart:
						from,
					rawEnd:
						to,
					osrmEnd:
						[
							...coordinates.at(
								-1
							)
						]
				};
			}

			function appendRouteCoordinates(
				coordinates
			) {
				const points =
					cleanRouteCoordinates(
						coordinates
					);

				if (
					!points.length
				) {
					return;
				}

				for (
					const point of points
				) {
					const previous =
						routeCoordinates.at(
							-1
						);

					if (
						!previous ||
						previous[0] !==
							point[0] ||
						previous[1] !==
							point[1]
					) {
						routeCoordinates.push(
							point
						);
					}
				}
			}

			function updateRouteSource() {
				if (
					!map ||
					!markerReady ||
					!map.getSource(
						"travel-route"
					)
				) {
					return;
				}

				map.getSource(
					"travel-route"
				).setData({
					type: "Feature",
					properties: {},
					geometry: {
						type: "LineString",
						coordinates:
							routeCoordinates
					}
				});
			}

			function animateOSRMRoute(
				route,
				startCoordinate,
				finalCoordinate,
				startBearing,
				targetBearing
			) {
				return new Promise(
					resolve => {
						if (
							routeAnimationFrame
						) {
							cancelAnimationFrame(
								routeAnimationFrame
							);

							routeAnimationFrame =
								null;
						}

						const originalLength =
							routeCoordinates.length;

						const baseLength =
							Math.max(
								0,
								originalLength -
								1
							);

						const routePrefix =
							routePrefixCoordinates(
								route,
								0
							);

						if (
							baseLength ===
							originalLength
						) {
							appendRouteCoordinates(
								routePrefix
							);
						} else {
							routeCoordinates.length =
								baseLength;

							appendRouteCoordinates(
								routePrefix
							);
						}

						updateRouteSource();

						if (
							!routeAnimation ||
							routeAnimationDuration <=
								0 ||
							!map ||
							!markerReady
						) {
							routeCoordinates.length =
								baseLength;

							appendRouteCoordinates(
								route.coordinates
							);

							updateRouteSource();

							map.jumpTo({
								center:
									finalCoordinate,
								bearing:
									targetBearing
							});

							currentBearing =
								normalizeBearing(
									targetBearing
								);

							resolve();
							return;
						}

						const startTime =
							performance.now();

						const animate =
							now => {
								const progress =
									clamp(
										(now -
											startTime) /
										routeAnimationDuration,
										0,
										1
									);

								const eased =
									progress < 0.5 ?
										4 *
										Math.pow(
											progress,
											3
										) :
										1 -
										Math.pow(
											-2 *
												progress +
												2,
											3
										) /
											2;

								const currentCoordinate =
									pointAlongOSRMRoute(
										route,
										eased
									);

								const visibleRoute =
									routePrefixCoordinates(
										route,
										eased
									);

								routeCoordinates.length =
									baseLength;

								appendRouteCoordinates(
									visibleRoute
								);

								if (
									currentCoordinate
								) {
									map.jumpTo({
										center:
											currentCoordinate
									});
								}

								if (
									smoothBearingEnabled &&
									Number.isFinite(
										startBearing
									) &&
									Number.isFinite(
										targetBearing
									)
								) {
									currentBearing =
										interpolateBearing(
											startBearing,
											targetBearing,
											eased
										);

									if (
										followBearing &&
										pitch > 0
									) {
										map.jumpTo({
											bearing:
												currentBearing
										});
									}
								} else if (
									Number.isFinite(
										targetBearing
									)
								) {
									currentBearing =
										normalizeBearing(
											targetBearing
										);

									if (
										followBearing &&
										pitch > 0
									) {
										map.jumpTo({
											bearing:
												currentBearing
										});
									}
								}

								updateRouteSource();

								if (
									progress <
									1
								) {
									routeAnimationFrame =
										requestAnimationFrame(
											animate
										);
								} else {
									routeAnimationFrame =
										null;

									routeCoordinates.length =
										baseLength;

									appendRouteCoordinates(
										route.coordinates
									);

									map.jumpTo({
										center:
											finalCoordinate,
										bearing:
											normalizeBearing(
												targetBearing
											)
									});

									currentBearing =
										normalizeBearing(
											targetBearing
										);

									updateRouteSource();

									resolve();
								}
							};

						routeAnimationFrame =
							requestAnimationFrame(
								animate
							);
					}
				);
			}

			async function applyLocation(
				rawLocation
			) {
				const location =
					normalizeLocation(
						rawLocation
					);

				if (!location) {
					return;
				}

				const timestamp =
					extractTimestamp(
						rawLocation
					);

				if (timestamp) {
					lastStreamerTimestamp =
						timestamp;
				}

				const rtirlTimeZone =
					extractTimeZone(
						rawLocation
					);

				if (
					rtirlTimeZone &&
					!streamerTimeZone
				) {
					setTimeZone(
						rtirlTimeZone,
						"rtirl"
					);
				}

				const coordinate = [
					location.longitude,
					location.latitude
				];

				statusEl.classList
					.remove(
						"opacity-0"
					);

				statusEl.classList
					.add(
						"opacity-100"
					);

				if (
					!firstFixReceived
				) {
					firstFixReceived =
						true;

					lastCoordinate =
						location;

					routeCoordinates.push(
						coordinate
					);

					if (map) {
						map.jumpTo({
							center:
								coordinate,
							zoom,
							pitch,
							bearing:
								currentBearing
						});
					}

					updateRouteSource();

					await updateLocationDetails(
						location
					);

					updateTemperature(
						location
					);

					updateClock();

					return;
				}

				if (
					!lastCoordinate ||
					metersBetween(
						lastCoordinate,
						location
					) <
						MIN_BEARING_DISTANCE_METERS
				) {
					updateClock();
					return;
				}

				const previousLocation =
					lastCoordinate;

				const previousCoordinate = [
					previousLocation.longitude,
					previousLocation.latitude
				];

				let targetBearing =
					lastHeading;

				if (
					!Number.isFinite(
						targetBearing
					)
				) {
					targetBearing =
						calculateBearing(
							previousLocation,
							location
						);
				}

				const startBearing =
					currentBearing;

				let route = null;

				try {
					route =
						await requestOSRMRoute(
							previousCoordinate,
							coordinate
						);
				} catch (error) {
					console.warn(
						"OSRM route error:",
						error
					);

					if (
						routeAnimationFrame
					) {
						cancelAnimationFrame(
							routeAnimationFrame
						);

						routeAnimationFrame =
							null;
					}

					if (map) {
						map.jumpTo({
							center:
								coordinate
						});
					}

					appendRouteCoordinates([
						coordinate
					]);

					updateRouteSource();
				}

				lastCoordinate =
					location;

				if (route) {
					const finalCoordinate =
						followOSRM ?
							[
								...route.osrmEnd
							] :
							coordinate;

					await animateOSRMRoute(
						route,
						previousCoordinate,
						finalCoordinate,
						startBearing,
						targetBearing
					);
				} else {
					if (
						smoothBearingEnabled
					) {
						animateBearingTo(
							targetBearing
						);
					} else {
						setMapBearing(
							targetBearing
						);
					}
				}

				await updateLocationDetails(
					location
				);

				updateTemperature(
					location
				);

				updateClock();
			}

			function createSpeedDigit(
				digit
			) {
				const wrapper =
					document.createElement(
						"span"
					);

				wrapper.className =
					"speed-digit";

				wrapper.dataset.value =
					digit;

				const track =
					document.createElement(
						"span"
					);

				track.className =
					"speed-digit-track";

				for (
					let i = 0;
					i < 30;
					i++
				) {
					const number =
						document.createElement(
							"span"
						);

					number.textContent =
						i % 10;

					number.className =
						"speed-digit-number";

					track.appendChild(
						number
					);
				}

				wrapper.appendChild(
					track
				);

				track.style.transform =
					`translateY(-${
						digit *
						SPEED_DIGIT_HEIGHT
					}px)`;

				return wrapper;
			}

			function renderSpeedImmediately(
				value
			) {
				speedEl.innerHTML =
					"";

				const digits =
					String(value)
						.split("");

				for (
					const digit of digits
				) {
					speedEl.appendChild(
						createSpeedDigit(
							Number(digit)
						)
					);
				}
			}

			function getShortestDigitDelta(
				from,
				to
			) {
				let delta =
					to - from;

				if (
					delta > 5
				) {
					delta -= 10;
				} else if (
					delta < -5
				) {
					delta += 10;
				}

				return delta;
			}

			function animateSpeedTo(
				target
			) {
				if (
					speedAnimationTimer
				) {
					clearTimeout(
						speedAnimationTimer
					);

					speedAnimationTimer =
						null;
				}

				const fromDigits =
					String(
						displayedSpeed
					).split("");

				const toDigits =
					String(target)
						.split("");

				if (
					toDigits.length >
					fromDigits.length
				) {
					const difference =
						toDigits.length -
						fromDigits.length;

					for (
						let i = 0;
						i < difference;
						i++
					) {
						const digit =
							Number(
								toDigits[i]
							);

						const newDigit =
							createSpeedDigit(
								digit
							);

						newDigit.classList
							.add(
								"speed-digit-new"
							);

						speedEl.insertBefore(
							newDigit,
							speedEl.firstChild
						);

						requestAnimationFrame(
							() => {
								newDigit.classList
									.add(
										"visible"
									);
							}
						);
					}
				} else if (
					toDigits.length <
					fromDigits.length
				) {
					const difference =
						fromDigits.length -
						toDigits.length;

					for (
						let i = 0;
						i < difference;
						i++
					) {
						const digit =
							speedEl
								.firstElementChild;

						if (
							digit
						) {
							digit.classList
								.add(
									"speed-digit-removing"
								);

							setTimeout(
								() => {
									digit.remove();
								},
								180
							);
						}
					}
				}

				requestAnimationFrame(
					() => {
						const duration =
							speedAnimationDuration;

						const wheels =
							speedEl.querySelectorAll(
								".speed-digit"
							);

						const currentDigits =
							String(
								displayedSpeed
							).padStart(
								toDigits.length,
								" "
							);

						wheels.forEach(
							(
								wheel,
								index
							) => {
								const track =
									wheel.querySelector(
										".speed-digit-track"
									);

								const currentChar =
									currentDigits[
										index
									];

								const fromDigit =
									Number.isFinite(
										Number(
											currentChar
										)
									) ?
										Number(
											currentChar
										) :
										0;

								const targetDigit =
									Number(
										toDigits[
											index
										]
									);

								const delta =
									getShortestDigitDelta(
										fromDigit,
										targetDigit
									);

								const baseIndex =
									10 +
									fromDigit;

								const targetIndex =
									baseIndex +
									delta;

								track.style.transition =
									"none";

								track.style.transform =
									`translateY(-${
										baseIndex *
										SPEED_DIGIT_HEIGHT
									}px)`;

								void track.offsetHeight;

								track.style.transition =
									`transform ${
										duration
									}ms cubic-bezier(.22,.61,.36,1)`;

								track.style.transform =
									`translateY(-${
										targetIndex *
										SPEED_DIGIT_HEIGHT
									}px)`;

								wheel.classList
									.add(
										"visible"
									);
							}
						);

						displayedSpeed =
							target;

						speedAnimationTimer =
							setTimeout(
								() => {
									speedAnimationTimer =
										null;

									const finalWheels =
										speedEl.querySelectorAll(
											".speed-digit"
										);

									finalWheels.forEach(
										(
											wheel,
											index
										) => {
											const track =
												wheel.querySelector(
													".speed-digit-track"
												);

											const digit =
												Number(
													toDigits[
														index
													]
												);

											track.style.transition =
												"none";

											track.style.transform =
												`translateY(-${
													digit *
													SPEED_DIGIT_HEIGHT
												}px)`;
										}
									);
								},
								duration
							);
					}
				);
			}

			function applySpeed(
				speed
			) {
				const numericSpeed =
					toNumber(
						speed
					);

				if (
					numericSpeed === null
				) {
					return;
				}

				const targetSpeed =
					Math.max(
						0,
						Math.round(
							numericSpeed *
							3.6
						)
					);

				if (
					displayedSpeed ===
					null
				) {
					displayedSpeed =
						targetSpeed;

					renderSpeedImmediately(
						targetSpeed
					);

					return;
				}

				if (
					targetSpeed ===
					displayedSpeed
				) {
					return;
				}

				if (
					!speedAnimation
				) {
					displayedSpeed =
						targetSpeed;

					renderSpeedImmediately(
						targetSpeed
					);

					return;
				}

				animateSpeedTo(
					targetSpeed
				);
			}

			function debugSpeed(
				value
			) {
				const target =
					Number(value);

				if (
					!Number.isFinite(
						target
					) ||
					target < 0
				) {
					console.warn(
						"debugSpeed(value): value must be a number >= 0"
					);

					return;
				}

				console.log(
					`Speed: ${
						displayedSpeed ??
						"--"
					} → ${
						target
					} km/h`
				);

				applySpeed(
					target / 3.6
				);
			}

			window.debugSpeed =
				debugSpeed;

			function applyHeading(
				heading
			) {
				const value =
					toNumber(
						heading
					);

				if (
					value === null
				) {
					return;
				}

				lastHeading =
					normalizeBearing(
						value
					);

				if (
					smoothBearingEnabled
				) {
					animateBearingTo(
						lastHeading
					);
				} else {
					setMapBearing(
						lastHeading
					);
				}
			}

			function connectToPullKey() {
				if (!pullKey) {
					console.error(
						"Missing pullKey URL parameter."
					);

					return;
				}

				if (
					typeof RealtimeIRL ===
					"undefined"
				) {
					console.error(
						"RealtimeIRL API failed to load."
					);

					return;
				}

				const client =
					RealtimeIRL.forPullKey(
						pullKey
					);

				locationSubscription =
					client.addLocationListener(
						location => {
							applyLocation(
								location
							);
						},
						error => {
							console.error(
								"RealtimeIRL location error:",
								error
							);
						}
					);

				speedSubscription =
					client.addSpeedListener(
						speed => {
							applySpeed(
								speed
							);
						},
						error => {
							console.error(
								"RealtimeIRL speed error:",
								error
							);
						}
					);

				if (
					typeof client.addHeadingListener ===
					"function"
				) {
					headingSubscription =
						client.addHeadingListener(
							heading => {
								applyHeading(
									heading
								);
							},
							error => {
								console.error(
									"RealtimeIRL heading error:",
									error
								);
							}
						);
				}
			}

			function isModerator(
				message
			) {
				const badges =
					message?.sender
						?.identity
						?.badges;

				if (
					!Array.isArray(
						badges
					)
				) {
					return false;
				}

				return badges.some(
					badge =>
						badge &&
						(
							badge.type ===
								"moderator" ||
							badge.type ===
								"broadcaster"
						)
				);
			}

			function parseRadarCommand(
				content
			) {
				if (
					typeof content !==
					"string"
				) {
					return null;
				}

				const trimmed =
					content.trim();

				const match =
					trimmed.match(
						/^!radar(?:\s+(.+?))?\s*$/i
					);

				if (
					!match
				) {
					return null;
				}

				const argument =
					match[1]
						?.trim()
						.toLowerCase();

				if (
					!argument
				) {
					return {
						type:
							"toggle"
					};
				}

				if (
					argument ===
						"1" ||
					argument ===
						"true"
				) {
					return {
						type:
							"set",
						value:
							true
					};
				}

				if (
					argument ===
						"0" ||
					argument ===
						"false"
				) {
					return {
						type:
							"set",
						value:
							false
					};
				}

				return null;
			}

			function handleKickMessage(
				message
			) {
				if (
					!isModerator(
						message
					)
				) {
					return;
				}

				const command =
					parseRadarCommand(
						message?.content
					);

				if (
					!command
				) {
					return;
				}

				if (
					command.type ===
					"toggle"
				) {
					showRadar =
						!showRadar;
				} else {
					showRadar =
						command.value;
				}

				updateRadarVisibility();

				console.log(
					`Radar ${
						showRadar
							? "enabled"
							: "disabled"
					} by Kick moderator command.`
				);
			}

			let kickClient =
				null;

			function connectToKick() {
				if (
					!CHANNEL
				) {
					console.log(
						"kickChannel not provided; Kick control disabled."
					);

					return;
				}

				if (
					typeof kichat ===
						"undefined" ||
					typeof kichat.KiChatjs !==
						"function"
				) {
					console.error(
						"kichat.js failed to load."
					);

					return;
				}

				try {
					kickClient =
						new kichat.KiChatjs();

					kickClient.on(
						"connected",
						() => {
							console.log(
								`Connected to Kick chat: ${CHANNEL}`
							);
						}
					);

					kickClient.on(
						"join",
						channel => {
							console.log(
								"Joined Kick channel:",
								channel?.info?.slug ||
								channel?.slug ||
								CHANNEL
							);
						}
					);

					kickClient.on(
						"message",
						(
							message,
							channel
						) => {
							const slug =
								channel?.info?.slug ||
								channel?.slug;

							if (
								slug &&
								slug.toLowerCase() !==
									CHANNEL.toLowerCase()
							) {
								return;
							}

							handleKickMessage(
								message
							);
						}
					);

					kickClient.on(
						"error",
						error => {
							console.error(
								"Kick chat error:",
								error
							);
						}
					);

					kickClient.connect();

					kickClient.join(
						CHANNEL
					);
				} catch (error) {
					console.error(
						"Failed to initialize Kick chat:",
						error
					);
				}
			}

			window.addEventListener(
				"beforeunload",
				() => {
					try {
						locationSubscription
							?.dispose?.();
					} catch (_) {}

					try {
						speedSubscription
							?.dispose?.();
					} catch (_) {}

					try {
						headingSubscription
							?.dispose?.();
					} catch (_) {}

					try {
						temperatureRequestController
							?.abort?.();
					} catch (_) {}

					try {
						if (
							routeAnimationFrame
						) {
							cancelAnimationFrame(
								routeAnimationFrame
							);
						}
					} catch (_) {}

					try {
						if (
							bearingAnimationFrame
						) {
							cancelAnimationFrame(
								bearingAnimationFrame
							);
						}
					} catch (_) {}

					try {
						kickClient
							?.close?.();
					} catch (_) {}
				}
			);

			initializeMap();

			setTimeZone(
				Intl.DateTimeFormat()
					.resolvedOptions()
					.timeZone,
				"fallback"
			);

			connectToPullKey();

			connectToKick();

			setInterval(
				updateClock,
				1000
			);
		})();

	</script>
