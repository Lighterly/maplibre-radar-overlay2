			radar.style.borderColor = mainColor;

			radar.style.boxShadow = `
        0 0 7px ${mainColor},

      `;

			infoCard.style.backgroundColor =
				hexToRgba(bgColor, 0.96);

			speedEl.style.color =
				mainColor;

			statusEl.style.backgroundColor =
				mainColor;

			statusEl.style.boxShadow =
				`0 0 7px ${mainColor}`;

			avatar.style.opacity =
				String(avatarOpacity);



			const fallbackAvatar =
				makeFallbackAvatar(mainColor);

			avatar.src =
				avatarURL || fallbackAvatar;

			avatar.addEventListener(
				"error",
				() => {
					if (avatar.src !== fallbackAvatar) {
						avatar.src = fallbackAvatar;
					}
				},
				{ once: true }
			);



			const routeCoordinates = [];

			let map = null;

			let data = null;

			let markerReady = false;

			let firstFixReceived = false;

			let lastCoordinate = null;

			let lastGeocodedCoordinate = null;

			let geocodingInProgress = false;

			let locationSubscription = null;

			let speedSubscription = null;

			let headingSubscription = null;

			let streamerTimeZone = null;

			let streamerTimeZoneSource = null;

			let lastStreamerTimestamp = null;



			const defaultCenter = [0, 0];

			const GEOCODE_DISTANCE_METERS = 100;

			const GOOGLE_SATELLITE_TILES = [
				"https://mt0.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
				"https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
				"https://mt2.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
				"https://mt3.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"
			];



			function clamp(value, min, max) {
				if (!Number.isFinite(value)) {
					return min;
				}

				return Math.min(
					max,
					Math.max(min, value)
				);
			}


			function toNumber(value) {
				const number =
					Number(value);

				return Number.isFinite(number)
					? number
					: null;
			}


			function sanitizeColor(value) {
				const color =
					String(value || "").trim();

				if (
					/^#[0-9a-fA-F]{3,8}$/.test(color)
				) {
					return color;
				}

				return "#00eaff";
			}


			function hexToRgba(hex, alpha) {
				let value =
					hex.replace("#", "");

				if (value.length === 3) {
					value =
						value
							.split("")
							.map(char => char + char)
							.join("");
				}

				if (value.length < 6) {
					return `rgba(0,234,255,${alpha})`;
				}

				const r =
					parseInt(value.slice(0, 2), 16);

				const g =
					parseInt(value.slice(2, 4), 16);

				const b =
					parseInt(value.slice(4, 6), 16);

				return `rgba(${r},${g},${b},${alpha})`;
			}


			function escapeXml(value) {
				return String(value).replace(
					/[<>&'"]/g,
					character => ({
						"<": "&lt;",
						">": "&gt;",
						"&": "&amp;",
						"'": "&apos;",
						'"': "&quot;"
					})[character]
				);
			}


			function makeFallbackAvatar(color) {
				const svg = `
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 100"
          >
            <rect
              width="100"
              height="100"
              fill="#163b71"
            />

            <circle
              cx="50"
              cy="39"
              r="17"
              fill="${escapeXml(color)}"
            />

            <path
              d="M20 88c3-22 15-32 30-32s27 10 30 32"
              fill="${escapeXml(color)}"
            />
          </svg>
        `;

				return (
					"data:image/svg+xml;charset=UTF-8," +
					encodeURIComponent(svg)
				);
			}


			/*
			============================================================
			DISTANCE
			============================================================
			*/

			function metersBetween(a, b) {
				const earthRadius =
					6371008.8;

				const p1 =
					a.latitude *
					Math.PI /
					180;

				const p2 =
					b.latitude *
					Math.PI /
					180;

				const dp =
					(b.latitude - a.latitude) *
					Math.PI /
					180;

				const dl =
					(b.longitude - a.longitude) *
					Math.PI /
					180;

				const h =
					Math.sin(dp / 2) ** 2 +
					Math.cos(p1) *
					Math.cos(p2) *
					Math.sin(dl / 2) ** 2;

				return (
					2 *
					earthRadius *
					Math.asin(
						Math.sqrt(h)
					)
				);
			}


			/*
			============================================================
			NORMALIZE RTIRL LOCATION
			============================================================
			*/

			function normalizeLocation(location) {
				if (!location) {
					return null;
				}

				const latitude =
					toNumber(
						location.latitude ??
						location.lat ??
						location.coords?.latitude ??
						location.location?.latitude
					);

				const longitude =
					toNumber(
						location.longitude ??
						location.lng ??
						location.lon ??
						location.coords?.longitude ??
						location.location?.longitude
					);

				if (
					latitude === null ||
					longitude === null
				) {
					return null;
				}

				if (
					latitude < -90 ||
					latitude > 90 ||
					longitude < -180 ||
					longitude > 180
				) {
					return null;
				}

				return {
					latitude,
					longitude
				};
			}


			/*
			============================================================
			TRY TO FIND A TIMESTAMP IN RTIRL DATA
			============================================================
			*/

			function extractTimestamp(value) {
				if (!value) {
					return null;
				}

				const candidates = [
					value.timestamp,
					value.timeStamp,
					value.time,
					value.datetime,
					value.date,
					value.createdAt,
					value.updatedAt,
					value.coords?.timestamp
				];

				for (const candidate of candidates) {
					if (candidate === undefined || candidate === null) {
						continue;
					}

					const parsed =
						candidate instanceof Date
							? candidate.getTime()
							: Date.parse(candidate);

					if (Number.isFinite(parsed)) {
						return parsed;
					}

					const numeric =
						Number(candidate);

					if (Number.isFinite(numeric)) {
						return numeric < 10000000000
							? numeric * 1000
							: numeric;
					}
				}

				return null;
			}


			/*
			============================================================
			TRY TO FIND A TIMEZONE IN RTIRL DATA
	  
			RTIRL's public listener API does not require a timezone field,
			so this intentionally checks common possible metadata fields
			without assuming they exist.
			============================================================
			*/

			function extractTimeZone(value) {
				if (!value) {
					return null;
				}

				const candidates = [
					value?.timeZone,
					value?.timezone,
					value?.tz,
					value.location?.timeZone,
					value.location?.timezone,
					value.metadata?.timeZone,
					value.metadata?.timezone,
					value.streamer?.timeZone,
					value.streamer?.timezone
				];

				for (const candidate of candidates) {
					if (
						typeof candidate === "string" &&
						isValidTimeZone(candidate)
					) {
						return candidate;
					}
				}

				return null;
			}


			function isValidTimeZone(timeZone) {
				if (
					typeof timeZone !== "string" ||
					!timeZone
				) {
					return false;
				}

				try {
					new Intl.DateTimeFormat(
						"en-US",
						{ timeZone }
					);

					return true;
				} catch {
					return false;
				}
			}


			function setTimeZone(timeZone, source = "location") {
				if (!isValidTimeZone(timeZone)) {
					return false;
				}

				streamerTimeZone =
					timeZone;

				streamerTimeZoneSource =
					source;

				updateClock();

				return true;
			}


			function formatTimeZoneLabel(timeZone) {
				try {
					const parts =
						timeZone.split("/");

					const city =
						parts.at(-1)
							?.replaceAll("_", " ");

					if (city) {
						return city;
					}
				} catch (_) { }

				return "Local time";
			}


			const stateTimezones = {
				"US-AL": "America/Chicago",
				"US-AK": "America/Anchorage",
				"US-AZ": "America/Phoenix",
				"US-AR": "America/Chicago",
				"US-CA": "America/Los_Angeles",
				"US-CO": "America/Denver",
				"US-CT": "America/New_York",
				"US-DE": "America/New_York",
				"US-FL": "America/New_York",
				"US-GA": "America/New_York",
				"US-HI": "Pacific/Honolulu",
				"US-ID": "America/Boise",
				"US-IL": "America/Chicago",
				"US-IN": "America/Indiana/Indianapolis",
				"US-IA": "America/Chicago",
				"US-KS": "America/Chicago",
				"US-KY": "America/New_York",
				"US-LA": "America/Chicago",
				"US-ME": "America/New_York",
				"US-MD": "America/New_York",
				"US-MA": "America/New_York",
				"US-MI": "America/Detroit",
				"US-MN": "America/Chicago",
				"US-MS": "America/Chicago",
				"US-MO": "America/Chicago",
				"US-MT": "America/Denver",
				"US-NE": "America/Chicago",
				"US-NV": "America/Los_Angeles",
				"US-NH": "America/New_York",
				"US-NJ": "America/New_York",
				"US-NM": "America/Denver",
				"US-NY": "America/New_York",
				"US-NC": "America/New_York",
				"US-ND": "America/Chicago",
				"US-OH": "America/New_York",
				"US-OK": "America/Chicago",
				"US-OR": "America/Los_Angeles",
				"US-PA": "America/New_York",
				"US-RI": "America/New_York",
				"US-SC": "America/New_York",
				"US-SD": "America/Chicago",
				"US-TN": "America/Chicago",
				"US-TX": "America/Chicago",
				"US-UT": "America/Denver",
				"US-VT": "America/New_York",
				"US-VA": "America/New_York",
				"US-WA": "America/Los_Angeles",
				"US-WV": "America/New_York",
				"US-WI": "America/Chicago",
				"US-WY": "America/Denver",
			};

			function getTimezone(principalSubdivisionCode) {
				const browserTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

				return stateTimezones[principalSubdivisionCode] ?? browserTimezone;
			}

			function updateClock() {
				if (!data) return;

				const timeZone = getTimezone(data.principalSubdivisionCode);

				const timestamp =
					lastStreamerTimestamp ||
					Date.now();

				clockEl.textContent =
					new Intl.DateTimeFormat(
						"pt-BR",
						{
							timeZone,
							hour: "2-digit",
							minute: "2-digit",
							second: "2-digit",
							hour12: false
						}
					).format(
						new Date(timestamp)
					);
			}



			async function reverseGeocode(
				latitude,
				longitude
			) {
				const url =
					new URL(
						"https://api.bigdatacloud.net/data/reverse-geocode-client"
					);

				url.searchParams.set(
					"latitude",
					latitude
				);

				url.searchParams.set(
					"longitude",
					longitude
				);

				url.searchParams.set(
					"localityLanguage",
					"en"
				);

				const response =
					await fetch(
						url.toString(),
						{
							method: "GET",
							cache: "no-store"
						}
					);

				if (!response.ok) {
					throw new Error(
						`Reverse geocoding failed: ${response.status}`
					);
				}

				return response.json();
			}



			function extractGeocoderTimeZone(data) {
				if (!data) {
					return null;
				}

				const directCandidates = [
					data.timeZone,
					data.timezone,
					data.ianaTimeZone,
					data.ianaTimezone
				];

				for (
					const candidate
					of directCandidates
				) {
					if (
						typeof candidate === "string" &&
						isValidTimeZone(candidate)
					) {
						return candidate;
					}
				}



				const informative =
					data.localityInfo?.informative;

				if (
					Array.isArray(informative)
				) {
					for (
						const item
						of informative
					) {
						const candidates = [
							item.timeZone,
							item.timezone,
							item.ianaTimeZone,
							item.ianaTimezone,
							item.name,
							item.isoName
						];

						for (
							const candidate
							of candidates
						) {
							if (
								typeof candidate === "string" &&
								isValidTimeZone(candidate)
							) {
								return candidate;
							}
						}
					}
				}

				return null;
			}



			function showLocation(
				data
			) {
				console.log(data);

				const neighborhood =
					data.locality ||
					data.neighbourhood ||
					data.suburb ||
					data.cityDistrict ||
					"";

				const city =
					data.city ||
					data.town ||
					data.village ||
					"";

				const country =
					data.countryName ||
					"";



				if (neighborhood) {
					neighborhoodEl.textContent =
						neighborhood;

					neighborhoodEl.classList.remove(
						"hidden"
					);

					neighborhoodSkeleton.classList.add(
						"hidden"
					);
				}



				const regionParts = [
					city,
					data.countryCode
				].filter(Boolean);

				if (regionParts.length) {
					regionEl.textContent =
						regionParts.join(", ");

					regionEl.classList.remove(
						"hidden"
					);

					regionSkeleton.classList.add(
						"hidden"
					);
				}

				clockLabelEl.textContent = data.principalSubdivision;
			}


			async function updateLocationDetails(
				location
			) {
				if (
					geocodingInProgress
				) {
					return;
				}

				if (
					lastGeocodedCoordinate &&
					metersBetween(
						lastGeocodedCoordinate,
						location
					) <
					GEOCODE_DISTANCE_METERS
				) {
					return;
				}

				lastGeocodedCoordinate = {
					...location
				};

				geocodingInProgress =
					true;

				try {
					data =
						await reverseGeocode(
							location.latitude,
							location.longitude
						);

					showLocation(data);



					if (
						!streamerTimeZone
					) {
						const timeZone =
							extractGeocoderTimeZone(data);

						if (timeZone) {
							setTimeZone(
								timeZone,
								"geocoder"
							);
						}
					}

				} catch (error) {
					console.warn(
						"RealtimeIRL reverse geocoding error:",
						error
					);
				} finally {
					geocodingInProgress =
						false;
				}
			}



			function initializeMap() {
				if (
					typeof maplibregl ===
					"undefined"
				) {
					console.error(
						"MapLibre GL JS failed to load."
					);

					return;
				}


				map =
					new maplibregl.Map({
						container: "map",

						style: {
							version: 8,

							sources: {
								"google-satellite": {
									type: "raster",

									tiles:
										GOOGLE_SATELLITE_TILES,

									tileSize: 256,

									attribution:
										"Google"
								}
							},

							layers: [
								{
									id:
										"google-satellite-layer",

									type:
										"raster",

									source:
										"google-satellite",

									minzoom: 0,

									maxzoom: 22
								}
							]
						},

						center:
							defaultCenter,

						zoom: params.get("zoom") || 16,
						pitch: params.get("pitch") || 0,

						minZoom: 2,

						maxZoom: 22,

						attributionControl:
							false,

						interactive:
							false,

						preserveDrawingBuffer:
							true,

						antialias:
							true
					});


				map.on(
					"load",
					() => {

						map.addSource(
							"travel-route",
							{
								type: "geojson",

								data: {
									type: "Feature",

									properties: {},

									geometry: {
										type: "LineString",

										coordinates: []
									}
								}
							}
						);



						map.addLayer({
							id:
								"travel-route-glow",

							type:
								"line",

							source:
								"travel-route",

							layout: {
								"line-cap":
									"round",

								"line-join":
									"round"
							},

							paint: {
								"line-color":
									mainColor,

								"line-width":
									10,

								"line-opacity":
									0.2,

								"line-blur":
									2.5
							}
						});



						map.addLayer({
							id:
								"travel-route-line",

							type:
								"line",

							source:
								"travel-route",

							layout: {
								"line-cap":
									"round",

								"line-join":
									"round"
							},

							paint: {
								"line-color":
									mainColor,

								"line-width":
									2.2,

								"line-opacity":
									0.95
							}
						});


						markerReady =
							true;

						updateRouteSource();
					}
				);
			}



			function updateRouteSource() {
				if (
					!map ||
					!markerReady ||
					!map.getSource(
						"travel-route"
					)
				) {
					return;
				}

				map
					.getSource(
						"travel-route"
					)
					.setData({
						type: "Feature",

						properties: {},

						geometry: {
							type: "LineString",

							coordinates:
								routeCoordinates
						}
					});
			}



			function applyLocation(
				rawLocation
			) {
				const location =
					normalizeLocation(
						rawLocation
					);

				if (!location) {
					return;
				}



				const timestamp =
					extractTimestamp(
						rawLocation
					);

				if (timestamp) {
					lastStreamerTimestamp =
						timestamp;
				}



				const rtirlTimeZone =
					extractTimeZone(
						rawLocation
					);

				if (
					rtirlTimeZone &&
					!streamerTimeZone
				) {
					setTimeZone(
						rtirlTimeZone,
						"rtirl"
					);
				}



				const coordinate = [
					location.longitude,
					location.latitude
				];


				if (!firstFixReceived) {
					firstFixReceived =
						true;

					map?.jumpTo({
						center:
							coordinate,

						zoom:
							16
					});

				} else {
					map?.jumpTo({
						center:
							coordinate
					});
				}



				if (
					!lastCoordinate ||
					metersBetween(
						lastCoordinate,
						location
					) >= 2
				) {
					routeCoordinates.push(
						coordinate
					);

					lastCoordinate =
						location;

					updateRouteSource();
				}



				statusEl.classList.remove(
					"opacity-0"
				);

				statusEl.classList.add(
					"opacity-100"
				);



				updateLocationDetails(
					location
				);



				updateClock();
			}



			function applySpeed(
				speed
			) {
				const numericSpeed =
					toNumber(speed);

				if (
					numericSpeed === null
				) {
					return;
				}


				const kmh =
					numericSpeed * 3.6;

				speedEl.textContent =
					Math.max(
						0,
						Math.round(kmh)
					);
			}



			function connectToPullKey() {
				if (!pullKey) {
					console.error(
						"Missing pullKey URL parameter."
					);

					return;
				}


				if (
					typeof RealtimeIRL ===
					"undefined"
				) {
					console.error(
						"RealtimeIRL API failed to load."
					);

					return;
				}


				const client =
					RealtimeIRL.forPullKey(
						pullKey
					);


				locationSubscription =
					client.addLocationListener(
						location => {
							applyLocation(
								location
							);
						},

						error => {
							console.error(
								"RealtimeIRL location error:",
								error
							);
						}
					);



				speedSubscription =
					client.addSpeedListener(
						speed => {
							applySpeed(
								speed
							);
						},

						error => {
							console.error(
								"RealtimeIRL speed error:",
								error
							);
						}
					);



				if (
					typeof client.addHeadingListener ===
					"function"
				) {
					headingSubscription =
						client.addHeadingListener(
							heading => {


								const value =
									toNumber(
										heading
									);

								if (
									value !== null
								) {
								}
							},

							error => {
								console.error(
									"RealtimeIRL heading error:",
									error
								);
							}
						);
				}
			}



			window.addEventListener(
				"beforeunload",
				() => {

					try {
						locationSubscription
							?.dispose?.();
					} catch (_) { }

					try {
						speedSubscription
							?.dispose?.();
					} catch (_) { }

					try {
						headingSubscription
							?.dispose?.();
					} catch (_) { }
				}
			);



			initializeMap();


			setTimeZone(
				"pt-BR",
				"fallback"
			);

			connectToPullKey();



			setInterval(
				updateClock,
				1000
			);

		})();
	</script>

	<style>
		@keyframes avatar-pulse {

			0%,
			100% {
				opacity: 0.9;
			}

			50% {
				opacity: 0.7;
			}
		}

		.animate-avatar-pulse {
			animation: avatar-pulse 3s ease-in-out infinite;
		}
	</style>

</body>
